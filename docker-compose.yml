name: qiongzhi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qiongzhi
      POSTGRES_USER: qiongzhi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qiongzhi_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiongzhi -d qiongzhi"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://qiongzhi:${POSTGRES_PASSWORD:-qiongzhi_dev_password}@postgres:5432/qiongzhi
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      AUTO_MIGRATE: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      PG_POOL_MAX: "20"
      UPLOAD_DIR: /app/.data/uploads
    volumes:
      - uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
