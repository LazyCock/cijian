apiVersion: v1
kind: Namespace
metadata:
  name: qiongzhi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qiongzhi-config
  namespace: qiongzhi
data:
  APP_URL: "https://qiongzhi.example.com"
  NODE_ENV: "production"
  AUTO_MIGRATE: "false"
  SEED_DEMO: "false"
  PG_POOL_MAX: "8"
---
apiVersion: v1
kind: Secret
metadata:
  name: qiongzhi-secrets
  namespace: qiongzhi
type: Opaque
stringData:
  # Replace before applying. Use an external secret manager in real clusters.
  AUTH_SECRET: "replace-with-at-least-32-random-characters"
  DATABASE_URL: "postgres://qiongzhi:replace@postgres.internal:5432/qiongzhi?sslmode=require"
  REDIS_URL: "redis://redis.internal:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qiongzhi-web
  namespace: qiongzhi
  labels:
    app: qiongzhi-web
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qiongzhi-web
  template:
    metadata:
      labels:
        app: qiongzhi-web
    spec:
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: qiongzhi-web
      containers:
        - name: web
          image: ghcr.io/example/qiongzhi-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: qiongzhi-config
            - secretRef:
                name: qiongzhi-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qiongzhi-web
  namespace: qiongzhi
spec:
  selector:
    app: qiongzhi-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qiongzhi-web
  namespace: qiongzhi
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: qiongzhi-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qiongzhi-web
  namespace: qiongzhi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qiongzhi-web
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
